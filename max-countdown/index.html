<title>Max Day Countdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one centered column — gauge hero, digit row, status ticker, footer note */
  :root {
    --bg: #EAF2EC;
    --panel: #FFFFFF;
    --ink: #17241E;
    --muted: #5C6E65;
    --line: #C9D8CE;
    --accent: #FF5E1F;
    --accent-2: #2457E6;
    --glow: #FFD23F;
    --screen: #17241E;
    --font-display: "Bungee", "Arial Black", Impact, sans-serif;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1713; --panel: #16231D; --ink: #E6F0EA; --muted: #8FA59A;
      --line: #2A3B33; --accent: #FF7A3D; --accent-2: #6E95FF; --glow: #FFD84F; --screen: #0A110E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1713; --panel: #16231D; --ink: #E6F0EA; --muted: #8FA59A;
    --line: #2A3B33; --accent: #FF7A3D; --accent-2: #6E95FF; --glow: #FFD84F; --screen: #0A110E;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
    overflow-x: hidden;
    position: relative;
  }

  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sky svg { position: absolute; }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

  main {
    position: relative; z-index: 1;
    max-width: 760px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); text-wrap: balance;
  }
  h1 {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(34px, 8vw, 64px); line-height: 1.02; margin: 6px 0 0;
    text-wrap: balance;
  }
  h1 .max { color: var(--accent); }

  .launch { width: 100%; max-width: 300px; }
  .launch svg { width: 100%; height: auto; display: block; overflow: visible; }
  .launch .label { font-family: var(--font-display); font-size: 21px; fill: var(--ink); }
  #rocket { animation: rumble 2.4s ease-in-out infinite; transform-box: view-box; }
  @keyframes rumble { 0%, 86%, 100% { transform: translate(0,0); } 89% { transform: translate(-1.5px,0); } 92% { transform: translate(1.5px,0); } 95% { transform: translate(-1px,0); } }
  #flame { transform-origin: 160px 234px; transform: scaleY(0); transition: transform .4s ease-out; }
  #flame path { animation: flicker .12s ease-in-out infinite alternate; transform-origin: 160px 234px; }
  @keyframes flicker { from { transform: scaleY(.85) scaleX(1.05); } to { transform: scaleY(1.1) scaleX(.92); } }
  .puff { animation: puff 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .puff.l { --dx: -26px; } .puff.r { --dx: 26px; }
  @keyframes puff { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(var(--dx), -14px) scale(1.4); opacity: 0; } }
  .launching #rocket { animation: none; transform: translateY(-900px); transition: transform 2.6s cubic-bezier(.55,0,.85,.4) .5s; }
  .launching #flame { transform: scaleY(1); }
  .launching .puff { animation-duration: .9s; }

  .digits {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    width: 100%; max-width: 620px;
  }
  .cell {
    background: var(--panel); border: 2px solid var(--ink); border-radius: 14px;
    padding-block: 14px 10px; box-shadow: 5px 5px 0 var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
  }
  .num {
    font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: clamp(30px, 9vw, 60px); line-height: 1;
  }
  .num.tick { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: translateY(-6px); color: var(--accent); } 100% { transform: none; } }
  .unit { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .status {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1.5px dashed var(--line); border-radius: 999px;
    padding: 10px 18px; max-width: 100%;
  }
  .status svg { flex: none; }
  .status p { margin: 0; font-size: 15px; min-width: 0; text-align: left; }

  .bot { width: 140px; height: auto; }
  .bot .eye { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .bot .arm-l { animation: type 0.5s ease-in-out infinite alternate; transform-origin: 48px 98px; }
  .bot .arm-r { animation: type 0.5s ease-in-out infinite alternate-reverse; transform-origin: 112px 98px; }
  @keyframes type { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .bot .float { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .when { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .when strong { color: var(--ink); font-weight: 700; }

  button {
    font: inherit; font-weight: 700; font-size: 14px;
    background: var(--accent); color: #fff; border: 2px solid var(--ink);
    border-radius: 10px; padding: 9px 16px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s;
  }
  button:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

  body.done h1 .max { animation: rainbow 1.2s linear infinite; }
  @keyframes rainbow { 0% { color: var(--accent); } 50% { color: var(--accent-2); } 100% { color: var(--accent); } }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; width: 100%; height: 100%; }

  @media (max-width: 480px) {
    .digits { gap: 8px; }
    .cell { box-shadow: 3px 3px 0 var(--ink); border-radius: 10px; }
    .status { border-radius: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<div class="sky" aria-hidden="true">
  <svg style="top:8%;left:6%" width="28" height="28" viewBox="0 0 24 24"><path class="twinkle" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--glow)"/></svg>
  <svg style="top:22%;right:8%" width="20" height="20" viewBox="0 0 24 24"><path class="twinkle" style="animation-delay:.8s" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--accent)"/></svg>
  <svg style="top:58%;left:4%" width="18" height="18" viewBox="0 0 24 24"><path class="twinkle" style="animation-delay:1.6s" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--accent-2)"/></svg>
  <svg style="top:72%;right:5%" width="26" height="26" viewBox="0 0 24 24"><path class="twinkle" style="animation-delay:2.2s" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--glow)"/></svg>
  <svg style="top:40%;right:14%" width="12" height="12" viewBox="0 0 24 24"><path class="twinkle" style="animation-delay:1.1s" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--glow)"/></svg>
  <svg style="top:88%;left:18%" width="14" height="14" viewBox="0 0 24 24"><path class="twinkle" style="animation-delay:.4s" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="var(--accent)"/></svg>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <header>
    <div class="eyebrow">Usage limits: about to get a lot less limited</div>
    <h1>Claude <span class="max">Max</span> launches in</h1>
  </header>

  <div class="launch" id="launch" aria-hidden="true">
    <svg viewBox="0 0 320 290">
      <!-- gantry tower -->
      <g stroke="var(--line)" stroke-width="4" fill="none">
        <path d="M250 248 L250 70 M276 248 L276 70"/>
        <path d="M250 90 L276 110 L250 130 L276 150 L250 170 L276 190 L250 210 L276 230"/>
        <path d="M250 120 L206 120"/>
      </g>
      <!-- rocket -->
      <g id="rocket">
        <!-- flame (hidden until launch, rides with the rocket) -->
        <g id="flame">
          <path d="M142 234 Q160 330 178 234 Z" fill="var(--glow)" stroke="var(--ink)" stroke-width="3"/>
          <path d="M150 234 Q160 290 170 234 Z" fill="var(--accent)"/>
        </g>
        <path d="M120 170 L92 226 L92 246 L120 226 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M200 170 L228 226 L228 246 L200 226 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <rect x="140" y="218" width="40" height="16" rx="3" fill="var(--ink)"/>
        <path d="M160 26 C190 56 200 108 200 168 L200 222 L120 222 L120 168 C120 108 130 56 160 26 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <path d="M160 26 C176 42 186 60 192 78 L128 78 C134 60 144 42 160 26 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="160" cy="118" r="21" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="4"/>
        <path d="M148 112 A13 13 0 0 1 160 104" fill="none" stroke="var(--panel)" stroke-width="4" stroke-linecap="round"/>
        <path d="M160 222 L160 196" stroke="var(--line)" stroke-width="3"/>
        <text class="label" x="160" y="182" text-anchor="middle">MAX</text>
      </g>
      <!-- vapour puffs -->
      <circle class="puff l" cx="128" cy="240" r="12" fill="var(--line)"/>
      <circle class="puff r" cx="192" cy="240" r="12" fill="var(--line)" style="animation-delay:1.4s"/>
      <!-- pad and ground -->
      <rect x="80" y="246" width="160" height="12" rx="3" fill="var(--ink)"/>
      <path d="M100 258 L92 280 M220 258 L228 280 M160 258 L160 280" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      <path d="M10 281 L310 281" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <section class="digits" aria-live="off" aria-label="Time remaining">
    <div class="cell"><span class="num" id="d">0</span><span class="unit">days</span></div>
    <div class="cell"><span class="num" id="h">00</span><span class="unit">hours</span></div>
    <div class="cell"><span class="num" id="m">00</span><span class="unit">mins</span></div>
    <div class="cell"><span class="num" id="s">00</span><span class="unit">secs</span></div>
  </section>

  <div class="status">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="13" cy="13" r="11" fill="none" stroke="var(--line)" stroke-width="3"/>
      <path d="M13 2 A11 11 0 0 1 24 13" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 13 13" to="360 13 13" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </svg>
    <p id="quip">Warming up the context window…</p>
  </div>

  <svg class="bot" viewBox="0 0 160 150" aria-hidden="true">
    <g class="float">
      <line x1="80" y1="18" x2="80" y2="34" stroke="var(--ink)" stroke-width="3"/>
      <path d="M80 2 L82.5 11 L91 13 L82.5 15 L80 24 L77.5 15 L69 13 L77.5 11 Z" fill="var(--glow)" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="38" y="34" width="84" height="62" rx="18" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
      <rect x="50" y="46" width="60" height="36" rx="10" fill="var(--screen)" stroke="var(--ink)" stroke-width="2"/>
      <rect class="eye" x="62" y="56" width="10" height="14" rx="4" fill="var(--glow)"/>
      <rect class="eye" x="88" y="56" width="10" height="14" rx="4" fill="var(--glow)"/>
      <circle cx="44" cy="74" r="4" fill="var(--accent)" opacity=".6"/>
      <circle cx="116" cy="74" r="4" fill="var(--accent)" opacity=".6"/>
    </g>
    <path class="arm-l" d="M48 98 L36 122" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path class="arm-r" d="M112 98 L124 122" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="18" y="120" width="124" height="20" rx="5" fill="var(--accent-2)" stroke="var(--ink)" stroke-width="3"/>
    <g fill="var(--panel)">
      <rect x="28" y="126" width="10" height="4" rx="1"/><rect x="42" y="126" width="10" height="4" rx="1"/>
      <rect x="56" y="126" width="10" height="4" rx="1"/><rect x="70" y="126" width="20" height="4" rx="1"/>
      <rect x="94" y="126" width="10" height="4" rx="1"/><rect x="108" y="126" width="10" height="4" rx="1"/>
      <rect x="122" y="126" width="10" height="4" rx="1"/>
    </g>
  </svg>

  <div class="when">
    <span>Upgrade o'clock: <strong>Monday 23 Nov, 11:00 pm AEDT</strong></span>
    <span id="local"></span>
  </div>

  <button id="party" type="button">Preview the party</button>
</main>

<script>
  const TARGET = new Date("2026-11-23T23:00:00+11:00").getTime();

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  try {
    // only mention local time when the viewer isn't on Sydney/Melbourne time
    const here = new Date(TARGET).getTimezoneOffset();
    if (here !== -660) {
      const local = new Date(TARGET).toLocaleString(undefined, { weekday: "long", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
      $("local").textContent = "That's " + local + " where you are.";
    }
  } catch (e) {}

  function quipFor(ms) {
    const h = ms / 3.6e6;
    if (ms <= 0) return "Max unlocked. Go build something ridiculous.";
    if (h < 0.0167) return "Final countdown. Fingers on the keyboard.";
    if (h < 1)  return "Under an hour. Start drafting the giant prompt.";
    if (h < 6)  return "Single-digit hours. The bot is stretching.";
    if (h < 24) return "Less than a day. Clear the calendar.";
    if (h < 48) return "Two sleeps-ish. Rationing tokens like gold.";
    return "Stockpiling ideas for the weekend…";
  }

  const last = {};
  function set(id, v) {
    const el = $(id);
    if (last[id] !== v) {
      el.textContent = v; last[id] = v;
      el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    }
  }

  let celebrated = false;
  function tick() {
    const now = Date.now();
    const ms = Math.max(0, TARGET - now);
    const s = Math.floor(ms / 1000);
    set("d", String(Math.floor(s / 86400)));
    set("h", pad(Math.floor(s / 3600) % 24));
    set("m", pad(Math.floor(s / 60) % 60));
    set("s", pad(s % 60));

    $("quip").textContent = quipFor(ms);

    if (ms <= 0 && !celebrated) {
      celebrated = true;
      document.body.classList.add("done");
      $("launch").classList.add("launching");
      document.querySelector("h1").innerHTML = 'Claude <span class="max">Max</span> has launched';
      confetti(6000);
    }
  }
  tick();
  setInterval(tick, 1000);

  // confetti
  const cv = $("confetti"), cx = cv.getContext("2d");
  let parts = [], until = 0, raf = 0;
  function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", size); size();
  function confetti(dur) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const css = getComputedStyle(document.documentElement);
    const cols = ["--accent", "--accent-2", "--glow", "--ink"].map(v => css.getPropertyValue(v).trim());
    until = performance.now() + dur;
    for (let i = 0; i < 180; i++) spawn(cols);
    if (!raf) raf = requestAnimationFrame(function loop(t) {
      cx.clearRect(0, 0, cv.width, cv.height);
      if (t < until && parts.length < 260) for (let i = 0; i < 3; i++) spawn(cols);
      parts = parts.filter(p => p.y < cv.height + 40);
      for (const p of parts) {
        p.vy += 0.08 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
        if (p.star) { star(p.w); } else cx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2);
        cx.restore();
      }
      raf = parts.length ? requestAnimationFrame(loop) : 0;
    });
  }
  function spawn(cols) {
    const d = devicePixelRatio;
    parts.push({ x: Math.random() * cv.width, y: -20 * d, vx: (Math.random() - .5) * 3 * d, vy: Math.random() * 3 * d,
      r: Math.random() * 6, vr: (Math.random() - .5) * .3, w: (6 + Math.random() * 8) * d,
      c: cols[Math.floor(Math.random() * cols.length)], star: Math.random() < .25 });
  }
  function star(w) {
    cx.beginPath();
    for (let i = 0; i < 8; i++) { const r = i % 2 ? w * .2 : w * .6, a = i * Math.PI / 4; cx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    cx.fill();
  }
  let resetT;
  $("party").addEventListener("click", () => {
    const l = $("launch");
    confetti(1800);
    if (celebrated) return;
    l.classList.add("launching");
    clearTimeout(resetT);
    resetT = setTimeout(() => {
      // drop a fresh rocket back on the pad
      l.classList.remove("launching");
      const r = $("rocket"); r.style.transition = "none"; void r.getBoundingClientRect(); r.style.transition = "";
    }, 4200);
  });
</script>
