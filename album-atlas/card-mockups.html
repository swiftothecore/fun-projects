<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Atlas Cards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--pink:#D6336C;--pink-soft:#FF6B9D;--border:#2A2A2A;--text:#F0EDE8;--muted:#888;--cream:#e6ddcf;--ink:#141210}
  body{background:radial-gradient(ellipse at 15% 100%,#1f0813 0%,transparent 50%),radial-gradient(ellipse at 85% 0%,#061510 0%,transparent 45%),#0D0D0D;color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;padding:32px 24px 64px}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.8rem}
  h1 em{color:var(--pink-soft)}
  .intro{color:var(--muted);margin:6px 0 28px;max-width:60ch;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:28px 20px}
  figure{display:flex;flex-direction:column;gap:10px}
  figcaption b{display:block;font-weight:600;font-size:.95rem}
  figcaption span{color:var(--muted);font-size:.82rem;line-height:1.45}
  .card{aspect-ratio:5/2;border-radius:20px;position:relative;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:inherit;background:#1a1a1a;transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
  .card:hover{transform:scale(1.025);box-shadow:0 20px 60px rgba(0,0,0,.6);border-color:var(--pink)}
  .card svg{position:absolute;inset:0;width:100%;height:100%}
  .pill{position:relative;align-self:flex-start;margin:12px;padding:5px 10px;border-radius:6px;background:rgba(0,0,0,.8);color:#fff;font-size:.78rem;font-weight:500}
  .serif{font-family:Georgia,'Times New Roman',serif}
  .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,Menlo,monospace}
  /* hover flourishes */
  .spin{transform-origin:390px 100px;transition:transform .9s cubic-bezier(.34,1.3,.64,1)}
  .card:hover .spin{transform:rotate(200deg)}
  .needle{transform-origin:390px 100px;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
  .card:hover .needle{transform:rotate(-25deg)}
  .pin{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .card:hover .pin{transform:translateY(-6px)}
  .tilt{transform-box:fill-box;transform-origin:bottom left;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .card:hover .tilt{transform:rotate(-14deg)}
  .route{stroke-dasharray:4 5;transition:stroke-dashoffset 1.2s linear}
  .card:hover .route{stroke-dashoffset:-60}
  .section{font-family:'DM Serif Display',serif;font-weight:400;font-size:1.4rem;margin:44px 0 18px}
  .badge{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-soft);margin-left:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Album Atlas<em>.</em> card mockups</h1>
<p class="intro">Alternatives for the home-page tile, shown at the real 5:2 size with the same hover lift and pink border. Hover each one; several have a small motion on hover.</p>
